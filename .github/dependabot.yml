version: 2

updates:
  # Everything lands in a single pull request. Merging several separate
  # Dependabot PRs left package.json and package-lock.json out of sync, which
  # breaks `npm ci` on the very first CI step.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
