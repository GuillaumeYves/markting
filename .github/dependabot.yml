version: 2

updates:
  # Everything lands in a single pull request. Merging several separate
  # Dependabot PRs left package.json and package-lock.json out of sync, which
  # breaks `npm ci` on the very first CI step.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint 8.x declares a peer range of typescript >=4.8.4
      # <6.1.0, so TypeScript 7 cannot be installed next to the linter.
      # Remove this entry once typescript-eslint ships TypeScript 7 support.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
